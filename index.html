<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Superheroes</title>
    <link rel="styleshhet" href="./css/styles.css">
</head>
<body>
    <header>
        <h1>Buscador de Superheroes</h1> 
    </header>
    <main>
        <section class="search-section">
            <h2>Encontra tu Superheroe</h2>
            <form id="search-form">
            <label for="search-input">Nombre del Superheroe</label>
                <input
                type="text"
                id="search-input"
                placeholder="Ej: Batman"
            >
            <button type="submit">Buscador</button>
            </form>    
        </section>
        <section class="results-section">
        <div  class="results-header">
            <h2>Resultados</h2>

            <label for="sort-select">Ordenar por:</label>
            <select id="sort-select">
                <option value="asc">A - Z</option>
                <option value="desc">Z -A</option>
            </select>
        </div>
        
        <p id="results-count">0 resultados</p>

        <div id="heroes-countainer">
        </div>
        </section>
        <section class="paginatón-section">
            <button id="first-page" disabled>Primera</button>
            <button id="previus-page">Anterior</button>

            <span id="current-page">Página 1</span>


            <button id="next-page" disabled>Siguiente</button>
            <button id="last-page" disabled>Última</button>
        </section>
        <section id="hero-detail" class="hero-detail" hidden>
        </section>
    </main>
    <script src="./js/app.js"></script>
</body>
</html>
